<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .emergency-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.05);
            pointer-events: none;
            animation: flash 2s infinite;
            z-index: 1;
        }

        @keyframes flash {
            0%, 100% { background: rgba(255, 0, 0, 0.02); }
            50% { background: rgba(255, 0, 0, 0.15); }
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 40px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px #ff0000, inset 0 0 20px #ff0000;
            background-color: rgba(10, 0, 0, 0.8);
            max-width: 90%;
        }

        h2 {
            font-size: 2rem; /* ปรับขนาดให้ใหญ่ขึ้นนิดหน่อยเพื่อชดเชยบรรทัดที่หายไป */
            margin-top: 0;
            margin-bottom: 30px;
            color: #ff6666;
            text-shadow: 0 0 10px #ff6666;
            letter-spacing: 2px;
        }

        .countdown-wrapper {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number {
            font-size: 4rem;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000;
        }

        .label {
            font-size: 1rem;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6666;
        }

        .ms-box {
            margin-top: 20px;
            font-size: 2rem;
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
        }

        .warning-text {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* รองรับมือถือ */
        @media (max-width: 600px) {
            .number { font-size: 2.5rem; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="emergency-overlay"></div>
    <div class="container">
        
        <h2>⚠️ PH.D. PROPOSAL EXAMINATION ⚠️</h2>
        
        <div class="countdown-wrapper">
            <div class="time-box">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>
        
        <div class="ms-box">
            <span id="milliseconds">000</span> <span style="font-size: 1rem;">MS</span>
        </div>

        <div class="warning-text">PREPARE FOR THE END... OF YOUR THESIS DRAFT</div>
    </div>

    <script>
        const countDownDate = new Date("Dec 19, 2026 00:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            if (distance < 0) {
                clearInterval(x);
                document.querySelector(".container").innerHTML = "<h2 style='font-size: 3rem; color: #00ff00; text-shadow: 0 0 20px #00ff00;'>MISSION ACCOMPLISHED</h2><h2 style='color: #fff;'>ขอให้สอบผ่านฉลุยครับ!</h2>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            const milliseconds = Math.floor((distance % 1000));

            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;
            
            let msString = milliseconds.toString();
            if (msString.length === 1) msString = "00" + msString;
            else if (msString.length === 2) msString = "0" + msString;
            document.getElementById("milliseconds").innerHTML = msString;
        }, 10);
    </script>
</body>
</html>
